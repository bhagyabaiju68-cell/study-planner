<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    form {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #name, #title {
      flex: 1;
    }
    #weight {
      width: 70px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    .error {
      color: #dc2626;
      min-height: 1.2em;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    #course-list li {
      cursor: pointer;
    }
    #course-list li:hover {
      background: #f3f4f6;
    }
    #course-list li.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .code {
      font-weight: bold;
      margin-right: 8px;
    }
    #details {
      display: none;
      margin-top: 32px;
      padding-top: 16px;
      border-top: 2px solid #e5e7eb;
    }
    #grade {
      font-size: 1.1em;
      font-weight: bold;
    }
    .assessment {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .assessment .info {
      flex: 1;
    }
    .assessment .due {
      color: #6b7280;
      font-size: 0.9em;
    }
    .assessment input {
      width: 60px;
    }
    .delete {
      background: none;
      color: #9ca3af;
      padding: 4px 8px;
      font-size: 1.1em;
    }
    .delete:hover {
      color: #dc2626;
    }
    #delete-course {
      background: #dc2626;
      margin-top: 24px;
    }
    #deadline-list li {
      display: flex;
      justify-content: space-between;
    }
    .soon {
      color: #dc2626;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Study Planner</h1>

  <h2>Due in the next 14 days</h2>
  <ul id="deadline-list"></ul>

  <h2>Add a course</h2>
  <form id="add-form">
    <input id="code" placeholder="COMP1531">
    <input id="name" placeholder="Software Engineering Fundamentals">
    <button type="submit">Add</button>
  </form>
  <p id="error" class="error"></p>

  <h2>My courses</h2>
  <ul id="course-list"></ul>

  <div id="details">
    <h2 id="details-title"></h2>
    <p id="grade"></p>

    <h3>Assessments</h3>
    <ul id="assessment-list"></ul>

    <h3>Add an assessment</h3>
    <form id="assessment-form">
      <input id="title" placeholder="Assignment 1">
      <input id="weight" type="number" placeholder="%">
      <input id="due" type="date">
      <button type="submit">Add</button>
    </form>
    <p id="details-error" class="error"></p>

    <button id="delete-course">Delete this course</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
